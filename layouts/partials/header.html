<header class="site-header">
  <a class="home" href="{{ "/" | relURL }}" aria-label="{{ site.Title }}, home">
    {{- partial "mark.html" "ml" -}}
  </a>
  <nav aria-label="Main">
    <ul>
      {{- $current := . }}
      {{- range site.Menus.main }}
      <li><a class="label" href="{{ .URL }}"{{ if $current.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
      {{- end }}
    </ul>
  </nav>
</header>
