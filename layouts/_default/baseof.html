<!doctype html>
<html lang="{{ site.Language.LanguageCode | default "en" }}">
<head>
  {{- partial "head.html" . }}
</head>
<body>
  {{- /* Decorative ASCII thermals (assets/js/site.js). Static Night without JS. */}}
  <div class="bg" aria-hidden="true"><canvas class="bg__field"></canvas></div>
  <a class="skip label" href="#main">Skip to content</a>
  <div class="wrap">
    {{- partial "header.html" . }}
    <main id="main">
      {{- block "main" . }}{{ end }}
    </main>
    {{- partial "footer.html" . }}
  </div>
</body>
</html>
